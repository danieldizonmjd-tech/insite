<!DOCTYPE html>
<html>
<head>
  <title>Simple Key Test</title>
  <style>
    body {
      font-family: monospace;
      background: #000;
      color: #0f0;
      padding: 2rem;
      font-size: 18px;
    }
    #log {
      border: 2px solid #0f0;
      padding: 1rem;
      min-height: 300px;
      margin-top: 1rem;
    }
    .entry {
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>🔑 SIMPLE KEYBOARD TEST</h1>
  <p>Press ANY key and it should appear below:</p>
  <div id="log">
    <div class="entry">Waiting for keyboard input...</div>
  </div>

  <script>
    console.log('Simple key test loaded');
    
    const log = document.getElementById('log');
    let count = 0;
    
    document.addEventListener('keydown', (e) => {
      count++;
      console.log('KEY DETECTED:', e.key, e);
      
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.textContent = `${count}. Key: "${e.key}" | Alt: ${e.altKey} | Ctrl: ${e.ctrlKey} | Meta: ${e.metaKey} | Code: ${e.code}`;
      
      log.insertBefore(entry, log.firstChild);
    });
    
    console.log('Event listener registered. Press any key...');
  </script>
</body>
</html>
