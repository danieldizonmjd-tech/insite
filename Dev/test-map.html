<!DOCTYPE html>
<html>
<head>
    <title>INSITE Map Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { height: 600px; width: 100%; border: 2px solid #333; }
        .status { padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🗺️ INSITE Map Loading Test</h1>
    <div id="status" class="status info">Loading map...</div>
    
    <div id="map"></div>

    <script>
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        function initMap() {
            try {
                updateStatus('Initializing Google Maps...', 'info');
                
                const map = new google.maps.Map(document.getElementById("map"), {
                    zoom: 11,
                    center: { lat: 33.75, lng: -84.39 },
                    mapTypeId: google.maps.MapTypeId.ROADMAP
                });

                updateStatus('✅ Google Maps loaded successfully!', 'success');
                
                // Test GeoJSON loading
                fetch("USPS_Zip_Codes_enriched.geojson")
                    .then(response => {
                        if (!response.ok) throw new Error('GeoJSON not found');
                        return response.json();
                    })
                    .then(data => {
                        map.data.addGeoJson(data);
                        updateStatus('✅ Map and data loaded successfully! Interactive features ready.', 'success');
                        
                        // Style the data
                        map.data.setStyle({
                            fillColor: '#8b5cf6',
                            strokeWeight: 1,
                            strokeColor: '#1e293b',
                            fillOpacity: 0.6
                        });
                    })
                    .catch(error => {
                        updateStatus('⚠️ GeoJSON error: ' + error.message, 'error');
                    });

            } catch (error) {
                updateStatus('❌ Error: ' + error.message, 'error');
                console.error('Map initialization error:', error);
            }
        }

        // Check if Google Maps API is available
        window.addEventListener('load', () => {
            if (typeof google === 'undefined') {
                updateStatus('❌ Google Maps API failed to load!', 'error');
            }
        });
    </script>

    <script defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap"></script>
</body>
</html>
